<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site editor</title>
<link rel="icon" href="../images/favicon.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="bar-left">
      <span class="logo">y_</span>
      <select id="page-select" aria-label="Page to edit"></select>
    </div>
    <div class="seg" id="viewport" role="group" aria-label="Preview size">
      <button type="button" data-vp="desktop" class="on">Desktop</button>
      <button type="button" data-vp="mobile">Mobile</button>
    </div>
    <div class="bar-right">
      <span id="status" class="status" role="status"></span>
      <button type="button" id="btn-settings" class="btn ghost">GitHub</button>
      <button type="button" id="btn-publish" class="btn primary">Publish</button>
    </div>
  </header>

  <div class="main">
    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="home">Home page</button>
        <button type="button" role="tab" data-tab="projects">Projects</button>
        <button type="button" role="tab" data-tab="site">Site</button>
      </nav>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <section class="stage">
      <div class="frame-wrap" id="frame-wrap">
        <iframe id="preview" title="Live preview of your site"></iframe>
      </div>
    </section>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<!-- GitHub connection -->
<dialog id="settings-dlg">
  <form method="dialog" id="settings-form">
    <h2>Connect to GitHub</h2>
    <p class="muted">Publishing saves your changes to your GitHub repository, and GitHub Pages then updates the live site. Your token stays in this browser only.</p>
    <div class="grid2">
      <label class="field"><span class="lbl">Repository owner</span><input id="gh-owner" type="text" autocomplete="off" placeholder="your-username"></label>
      <label class="field"><span class="lbl">Repository name</span><input id="gh-repo" type="text" autocomplete="off" placeholder="portfolio"></label>
    </div>
    <label class="field"><span class="lbl">Branch</span><input id="gh-branch" type="text" autocomplete="off" placeholder="main"></label>
    <label class="field"><span class="lbl">Access token</span>
      <input id="gh-token" type="password" autocomplete="off" placeholder="github_pat_…">
      <span class="hint">Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>: choose <b>Only select repositories</b> → this repo, then under Permissions set <b>Contents: Read and write</b>.</span>
    </label>
    <p id="gh-result" class="result" hidden></p>
    <div class="dlg-actions">
      <button type="button" id="gh-forget" class="btn ghost danger">Forget token</button>
      <span class="spacer"></span>
      <button type="button" id="gh-close" class="btn ghost">Close</button>
      <button type="button" id="gh-save" class="btn primary">Save &amp; test</button>
    </div>
  </form>
</dialog>

<!-- Publish -->
<dialog id="publish-dlg">
  <form method="dialog" id="publish-form">
    <h2 id="pub-title">Publish changes</h2>
    <p id="pub-summary" class="muted"></p>
    <label class="field" id="pub-msg-field"><span class="lbl">Note (optional)</span><input id="pub-msg" type="text" placeholder="Update site content"></label>
    <ul id="pub-log" class="log" hidden></ul>
    <p id="pub-result" class="result" hidden></p>
    <div class="dlg-actions">
      <span class="spacer"></span>
      <button type="button" id="pub-close" class="btn ghost">Cancel</button>
      <button type="button" id="pub-go" class="btn primary">Publish now</button>
    </div>
  </form>
</dialog>

<script type="module">
  // Start the editor. If anything goes wrong, say so on screen instead of showing a blank page.
  const fail = (why) => {
    document.getElementById('panel-body').innerHTML =
      '<div class="tip"><b>The editor could not start.</b><br>' + why + '</div>';
  };
  if (location.protocol === 'file:') {
    fail('You opened this file directly from your computer. The editor must be opened through the little local server instead — ' +
         'double-click <b>Start editor</b> in the project folder (or run <code>node serve.mjs</code>).');
  } else {
    import('./admin.js').catch((e) =>
      fail('A file the editor needs did not load (' + String(e && e.message || e) + '). ' +
           'This editor is meant to be run from your own computer with <b>Start editor</b> / <code>node serve.mjs</code>, ' +
           'with the whole project folder present (it needs the <code>src</code>, <code>content</code> and <code>css</code> folders next to <code>admin</code>).'));
  }
</script>
</body>
</html>
